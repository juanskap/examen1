    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;

      display: flex; align-items: center; justify-content: space-between;
      padding: 0 30px; height: 64px;
    }
    nav .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 1.2em; color: #2d5a2d;
      text-decoration: none;
    }
    nav .brand svg { width: 28px; height: 28px; }
    nav ul { display: flex; list-style: none; gap: 8px; }
    nav ul li a {
      display: block; padding: 8px 16px; border-radius: 8px;
      color: #4a5a4a; text-decoration: none; font-size: 0.95em;
      transition: background 0.2s, color 0.2s;
    }
    nav ul li a:hover { background: #e8f0e8; color: #2d5a2d; }
    nav .hamburger { display: none; background: none; border: none; font-size: 1.5em; cursor: pointer; color: #2d5a2d; }

    header {
      background: linear-gradient(135deg, #2d5a2d, #3a7a3a);
      text-align: center; padding: 50px 20px;
    }
    header h1 { font-size: 2.8em; margin-bottom: 10px; color: #fff; }
    header p { color: #c8e6c9; font-size: 1.15em; }
    .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }
    .card {
      background: #fff; border-radius: 18px; overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid #d5e0d5; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.1); }

    .card-img-wrap {
      width: 100%; height: 200px; background: #f0f5f0;
      display: flex; align-items: center; justify-content: center;
      padding: 30px;
    }
    .card-img-wrap img {
      max-width: 65%; max-height: 120px; object-fit: contain;
    }

    .card-body { padding: 20px; }
    .card-body h2 { font-size: 1.5em; margin-bottom: 6px; color: #2d3a2d; }
    .card-body .category {
      display: inline-block; background: #e8f0e8; color: #3a7a3a;
      padding: 4px 14px; border-radius: 20px; font-size: 0.85em; margin-bottom: 10px;
    }
    .card-body .desc { color: #5a6a5a; line-height: 1.6; margin-bottom: 15px; }
    .card-body .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .card-body .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; background: #3a7a3a; color: #fff;
      text-decoration: none; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.95em; transition: background 0.3s;
    }
    .card-body .btn:hover { background: #4a9a4a; }
    .card-body .btn-download { background: #1a6a3a; }
    .card-body .btn-download:hover { background: #258a4e; }
    .card-body .btn-details { background: #6a7a6a; }
    .card-body .btn-details:hover { background: #8a9a8a; }
    .no-link { color: #8a9a8a; font-size: 0.9em; font-style: italic; }

    .gallery {
      display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px 15px;
      scroll-snap-type: x mandatory;
    }
    .gallery::-webkit-scrollbar { height: 6px; }
    .gallery::-webkit-scrollbar-thumb { background: #c8d8c8; border-radius: 10px; }
    .gallery::-webkit-scrollbar-track { background: #e8ede8; border-radius: 10px; }
    .gallery img {
      height: 80px; border-radius: 8px; scroll-snap-align: start;
      flex-shrink: 0; background: #f0f5f0; border: 1px solid #e0e8e0;
    }

    .filters {
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 30px;
    }
    .filters button {
      padding: 8px 20px; border-radius: 20px; border: 1px solid #c8d8c8;
      background: #fff; color: #4a5a4a; cursor: pointer; font-size: 0.9em;
      transition: all 0.2s;
    }
    .filters button:hover { border-color: #3a7a3a; color: #3a7a3a; }
    .filters button.active { background: #3a7a3a; color: #fff; border-color: #3a7a3a; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff; border-radius: 18px; max-width: 700px;
      width: 90%; max-height: 85vh; overflow-y: auto; padding: 30px;
      border: 1px solid #d5e0d5; position: relative;
    }
    .modal-close {
      position: absolute; top: 15px; right: 20px; font-size: 1.8em;
      cursor: pointer; color: #8a9a8a; background: none; border: none;
    }
    .modal-close:hover { color: #2d3a2d; }

    .modal .cat {

    }
    .modal p { color: #5a6a5a; line-height: 1.7; margin-bottom: 20px; }
    .modal .info-grid {

    }
    .modal .info-item {

    }
    .modal .info-item h4 { color: #3a7a3a; font-size: 0.95em; margin-bottom: 4px; }
    .modal .info-item p { color: #5a6a5a; font-size: 0.9em; margin: 0; }
    .modal .modal-logo {

      padding: 25px; margin-bottom: 20px;
    }

    }
    .modal h3 { color: #3a7a3a; margin-top: 20px; margin-bottom: 8px; font-size: 1.1em; }
    .modal ul { list-style: none; padding: 0; }
    .modal ul li {

    }
    .modal ul li::before { content: "\u2713 "; color: #4a9a4a; }

</head>

    ${cats.map(c => `<button data-filter="${c}">${c}</button>`).join("")}`;
  container.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      container.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderCards();
    });
  });
}

function renderCards() {
  const filtered = currentFilter === "all" ? aiData : aiData.filter(a => a.category === currentFilter);
  const grid = document.getElementById("aiGrid");
  grid.innerHTML = filtered.map(ai => `
    <div class="card">
      <div class="card-img-wrap">
        <img src="${ai.logo}" alt="${ai.name}" loading="lazy">
      </div>
      <div class="card-body">
        <span class="category">${ai.category}</span>
        <h2>${ai.name}</h2>
        <p class="desc">${ai.desc}</p>
        <div class="actions">
          <a class="btn" href="${ai.url}" target="_blank">Visitar</a>
          ${ai.download ? `<a class="btn btn-download" href="${ai.download}" target="_blank">Descargar</a>` : '<span class="no-link">Sin app</span>'}
          <button class="btn btn-details" onclick="openModal(${aiData.indexOf(ai)})">Detalles</button>
        </div>
      </div>
      <div class="gallery">
        ${ai.gallery.map(g => `<img src="${g}" alt="${ai.name}">`).join("")}
      </div>
    </div>
  `).join("");
}

function toggleNav() {
  document.getElementById("navMenu").classList.toggle("open");
}
function closeNav() {
  document.getElementById("navMenu").classList.remove("open");
}

function openModal(i) {
  const ai = aiData[i];
  const modal = document.getElementById("modal");
  document.getElementById("modalContent").innerHTML = `
    <h2>${ai.name}</h2>
    <span class="cat">${ai.category}</span>
    <div class="modal-logo">
      <img src="${ai.logo}" alt="${ai.name}">
    </div>
    <p>${ai.desc}</p>
    <div class="info-grid">
      <div class="info-item">
        <h4>Empresa</h4>
        <p>${ai.company}</p>
      </div>
      <div class="info-item">
        <h4>Lanzamiento</h4>
        <p>${ai.lanzamiento}</p>
      </div>
      <div class="info-item">
        <h4>Precio</h4>
        <p>${ai.pricing}</p>
      </div>
      <div class="info-item">
        <h4>Sitio web</h4>
        <p><a href="${ai.url}" target="_blank" style="color:#3a7a3a;">${ai.url}</a></p>
      </div>
    </div>
    <h3>Caracter\u00edsticas principales</h3>
    <ul>
      ${ai.features.map(f => `<li>${f}</li>`).join("")}
    </ul>
    ${ai.download ? `<a class="btn btn-download" href="${ai.download}" target="_blank" style="display:inline-flex;margin-top:15px;background:#1a6a3a;">Descargar app</a>` : ""}
  `;
  modal.classList.add("active");
}

document.getElementById("modalClose").addEventListener("click", () => {
  document.getElementById("modal").classList.remove("active");
});
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById("modal").classList.remove("active");
  }
});

document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener("click", e => {
    const el = document.querySelector(a.getAttribute("href"));
    if (el) el.scrollIntoView({ behavior: "smooth" });
  });
});

renderFilters();
renderCards();
</script>

</body>
</html>
